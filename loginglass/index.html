<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Estilos -->
     <link rel="stylesheet" href="style.css">

    <title>Glassmorphic Login form</title>
</head>
<body>
    <div class="background">
        <div class="overlay"></div>
    </div>
    <div class="card">
        <div class="top-bar">
            <span class="brand">Cannabis Lab</span>
            <a href="·" class="signup">Sign up</a>
        </div>
        <h1>Log in</h1>
        <div class="social-btn">
            <i class="fa-brands fa-facebook-f"></i>
            <span>Facebook</span>            
        </div>
        <form action="">
            <div class="input-box">
                <div class="icon">
                    <i class="fa-solid fa-at"></i>
                </div>
                <input type="email" placeholder="e-mail address">
            </div>
            <div class="input-box password-box">
                <div class="icon">
                    <i class="fa-solid fa-key"></i>                    
                </div>
                <input type="password" placeholder="password">
                <button type="button" class="forgot-btn">I forgot</button>
            </div>
            <p class="warning">
                For use by adults only (18 years of age and older).
                Keep out of reach of children and pets.
                In case of accidental ingestion contact our hotline.
            </p>

            <button class="login-btn"><i class="fa-solid fa-chevron-right"></i></button>

            <p class="footer-text">
                Please consume responsibly!
            </p>
        </form>
    </div>
</body>
</html>
